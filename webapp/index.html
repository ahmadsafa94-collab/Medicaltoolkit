<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Book Shelf</title>
  <!--
    The "?v=" on style.css/app.js below is a manual cache-buster: Telegram's
    in-app WebView has been observed to keep serving an old cached copy of
    this mini app's CSS/JS after a redeploy even with the server's own
    Cache-Control: no-store headers (see webapp_api.py's
    NoCacheStaticMiddleware) applied. Since a query string makes it a
    literally different URL, no cache -- Telegram's own included -- has an
    old copy to (incorrectly) reuse. BUMP THIS NUMBER on every deploy that
    changes style.css or app.js, or the fix for THIS bug silently stops
    covering your NEXT change.
  -->
  <link rel="stylesheet" href="style.css?v=5" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- ============ SHELF (root) ============ -->
  <section id="view-shelf" class="view">
    <header class="topbar shelf-topbar">
      <h1>📚 Book Shelf</h1>
      <button id="btn-bookmarks" class="link-btn">🔖 Bookmarks</button>
    </header>
    <div id="shelf-empty" class="empty-state" hidden>
      <p>No books yet.</p>
      <p class="muted">Tap + to upload your first PDF.</p>
    </div>
    <div id="shelf-grid" class="shelf-grid"></div>
    <button id="btn-add-book" class="fab" title="Add a book">+</button>
    <input id="file-input" type="file" accept="application/pdf" hidden />
  </section>

  <!-- ============ BOOKMARKS ============ -->
  <section id="view-bookmarks" class="view" hidden>
    <header class="topbar"><h1>🔖 Bookmarks</h1></header>
    <div id="bookmarks-empty" class="empty-state" hidden>
      <p>No bookmarks yet.</p>
      <p class="muted">Open a book's reader and tap 🔖 Bookmark this page.</p>
    </div>
    <div id="bookmarks-list" class="bookmarks-list"></div>
  </section>

  <!-- ============ UPLOAD PROGRESS ============ -->
  <section id="view-upload" class="view" hidden>
    <header class="topbar"><h1>Uploading…</h1></header>
    <div class="panel">
      <div class="progress-track"><div id="upload-bar" class="progress-fill" style="width:0%"></div></div>
      <p id="upload-status" class="muted">Starting upload…</p>
    </div>
  </section>

  <!-- ============ BOOK DETAIL ============ -->
  <section id="view-book" class="view" hidden>
    <header class="topbar">
      <h1 id="book-title">Book</h1>
      <p id="book-meta" class="muted"></p>
    </header>
    <div class="action-grid">
      <button class="action-btn" data-action="chapters">
        <span class="icon">📖</span><span>Divide into chapters</span>
        <span id="chapters-badge" class="badge"></span>
      </button>
      <button class="action-btn" data-action="read">
        <span class="icon">🔎</span><span>Read the book</span>
      </button>
      <button class="action-btn" data-action="summarize">
        <span class="icon">📝</span><span>Summarize</span>
      </button>
      <button class="action-btn" data-action="ask">
        <span class="icon">💬</span><span>Ask questions using AI</span>
      </button>
      <button class="action-btn" data-action="quiz">
        <span class="icon">❓</span><span>Create a quiz</span>
      </button>
      <button class="action-btn" data-action="flashcards">
        <span class="icon">🗂</span><span>Flashcards</span>
      </button>
    </div>
    <div id="book-panel" class="panel" hidden></div>
  </section>

  <!-- ============ READER ============ -->
  <section id="view-reader" class="view" hidden>
    <header class="topbar reader-topbar">
      <button id="reader-prev" class="pager-btn">‹</button>
      <span id="reader-page-label">Page 1</span>
      <button id="reader-next" class="pager-btn">›</button>
    </header>
    <div class="reader-toolbar">
      <button id="reader-zoom-out" class="tool-btn" title="Zoom out">−</button>
      <span id="reader-zoom-label" class="muted">100%</span>
      <button id="reader-zoom-in" class="tool-btn" title="Zoom in">+</button>
      <button id="reader-goto" class="tool-btn" title="Jump to page">🔢 Go to page</button>
      <button id="reader-bookmark" class="tool-btn" title="Bookmark this page">🔖 Bookmark</button>
      <button id="reader-notes" class="tool-btn" title="Notes on this page">📝 Notes</button>
    </div>
    <div id="reader-goto-row" class="name-editor" hidden>
      <input id="reader-goto-input" type="number" min="1" placeholder="Page number" />
      <button id="reader-goto-go" class="btn">Go</button>
      <button id="reader-goto-cancel" class="btn secondary">Cancel</button>
    </div>
    <div id="reader-notes-panel" class="reader-notes-panel" hidden>
      <div id="reader-notes-list"></div>
      <textarea id="reader-note-input" placeholder="Add a note on this page…" rows="3"></textarea>
      <div class="flash-review-row">
        <button id="reader-note-save" class="btn">Save note</button>
        <button id="reader-notes-close" class="btn secondary">Close</button>
      </div>
    </div>
    <div id="reader-canvas-wrap">
      <div id="reader-page-container">
        <canvas id="reader-canvas"></canvas>
        <div id="reader-text-layer" class="textLayer"></div>
      </div>
    </div>
  </section>

  <!-- ============ ACTION SHEET (book ⋮ menu, cover picker, shelf rename) ============ -->
  <div id="action-sheet-backdrop" class="sheet-backdrop" hidden>
    <div id="action-sheet" class="action-sheet"></div>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
